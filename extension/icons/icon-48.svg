<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 128 128" role="img" aria-label="DeepSeek Chat Exporter">
  <!--
    DeepSeek Chat Exporter 图标源文件（48 × 48，与 icon-128.svg 同源）
    构图：DeepSeek 品牌蓝圆角底板 + 白色鲸鱼 + 右下角导出（下载）徽章
    鲸鱼图形来源：simple-icons（CC0）DeepSeek 图标路径
    小尺寸说明：16 × 16 版本见 icon-16.svg，去掉了徽章以保证辨识度
  -->
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7590FF"/>
      <stop offset="0.5" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#2A3AD6"/>
    </linearGradient>
    <radialGradient id="ds-glow" cx="0.18" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角底板：DeepSeek 品牌蓝渐变 + 左上柔光 -->
  <rect width="128" height="128" rx="28" fill="url(#ds-bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#ds-glow)"/>

