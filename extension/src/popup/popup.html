<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Exporter</title>
  <style>
    body {
      width: 350px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .popup {
      padding: 16px;
      background: #ffffff;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #111827;
    }

    .status {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.connected {
      background: #d1fae5;
      color: #065f46;
    }

    .info {
      margin-bottom: 12px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }

    .info-item .label {
      color: #6b7280;
    }

    .info-item .value {
      color: #111827;
      font-weight: 500;
      font-family: monospace;
    }

    .tip {
      font-size: 12px;
      color: #92400e;
      background: #fef3c7;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2563eb;
    }

    .btn-secondary {
      background: #10b981;
      color: white;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #059669;
    }

    .progress {
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .progress-fill {
      height: 100%;
      background: #3b82f6;
      transition: width 0.3s ease;
    }

    .progress-text {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    .message {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      background: #dbeafe;
      color: #1e40af;
      word-break: break-all;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .debug {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
    }

    .debug summary {
      cursor: pointer;
      user-select: none;
    }

    .debug ul {
      margin: 6px 0 0;
      padding-left: 16px;
      max-height: 140px;
      overflow-y: auto;
    }

    .debug li {
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
      padding: 1px 0;
    }

    .logs {
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
    }

    .logs summary {
      cursor: pointer;
      user-select: none;
    }

    .logs-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .log-btn {
      flex: 1;
      border: 1px solid var(--color-border, #e5e7eb);
      background: #f9fafb;
      color: #374151;
      border-radius: 4px;
      font-size: 11px;
      padding: 4px 0;
      cursor: pointer;
    }

    .log-btn:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }

    .logs-view {
      margin: 6px 0 0;
      padding: 8px;
      max-height: 180px;
      overflow-y: auto;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      color: #334155;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
