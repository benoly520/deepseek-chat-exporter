<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Exporter</title>
  <style>
    body {
      width: 350px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .popup {
      padding: 16px;
      background: #ffffff;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .header .version {
      font-size: 11px;
      font-weight: 400;
      color: #9ca3af;
    }

    .status {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.connected {
      background: #d1fae5;
      color: #065f46;
    }

    .info {
      margin-bottom: 12px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }

    .info-item .label {
      color: #6b7280;
    }

    .info-item .value {
      color: #111827;
      font-weight: 500;
      font-family: monospace;
    }

    .tip {
      font-size: 12px;
      color: #92400e;
      background: #fef3c7;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .tip-detail {
      margin-top: 4px;
      font-size: 11px;
      color: #a16207;
      word-break: break-all;
    }

    .panel {
      margin-bottom: 12px;
    }

    .panel-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
    }

    .panel-toolbar .check-all {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }

    .panel-toolbar .muted {
      color: #9ca3af;
      flex: 1;
    }

    .mini-btn {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      border-radius: 4px;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
    }

    .mini-btn:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }

    .list-loading {
      padding: 18px 10px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      background: #f9fafb;
      border-radius: 6px;
    }

    .session-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
    }

    .session-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
      font-size: 13px;
    }

    .session-item:hover {
      background: #f0f4ff;
    }

    .session-item .session-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #dc2626;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2563eb;
    }

    .btn-secondary {
      background: #10b981;
      color: white;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #059669;
    }

    .progress {
      margin-bottom: 16px;
    }

    .progress-title {
      font-size: 12px;
      color: #1e40af;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-hint {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .progress-bar {
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .progress-fill {
      height: 100%;
      background: #3b82f6;
      transition: width 0.3s ease;
    }

    .progress-text {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    .message {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      background: #dbeafe;
      color: #1e40af;
      word-break: break-all;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    /* ---------- 可折叠面板（诊断 / 日志统一风格） ---------- */
    .collapsible {
      margin-top: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #ffffff;
      overflow: hidden;
    }

    .collapsible > summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      font-size: 12px;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
    }

    .collapsible > summary::-webkit-details-marker {
      display: none;
    }

    .collapsible > summary:hover {
      color: #3b82f6;
    }

    /* 展开 / 收起箭头：SVG 雪佛龙，收起朝右、展开旋转 90° 朝下 */
    .collapsible > summary::before {
      content: '';
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6l6 6-6 6'/></svg>") center/contain no-repeat;
      transition: transform 0.15s ease;
    }

    .collapsible[open] > summary::before {
      transform: rotate(90deg);
    }

    .collapsible[open] > summary {
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .collapsible-body {
      background: #ffffff;
    }

    .url-list {
      margin: 0;
      padding: 8px 10px;
      max-height: 180px;
      overflow-y: auto;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 10px;
      color: #334155;
      word-break: break-all;
    }

    .url-list li {
      padding: 1px 0;
    }

    .logs-actions {
      display: flex;
      gap: 6px;
      padding: 8px 8px 0;
    }

    .log-btn {
      flex: 1;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      border-radius: 4px;
      font-size: 11px;
      padding: 4px 0;
      cursor: pointer;
    }

    .log-btn:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }

    .logs-view {
      margin: 8px;
      padding: 8px;
      max-height: 180px;
      overflow-y: auto;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      color: #334155;
    }

      /* ---------- 滚动条（隐藏三角箭头，圆角半透明滑块） ---------- */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.14);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.24);
      }
      ::-webkit-scrollbar-button {
        display: none;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
